services:
  mysql:
    image: mysql:8.4
    container_name: sistema-vet-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sistema_vet_app
      MYSQL_USER: vet
      MYSQL_PASSWORD: vet
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sistema_vet_app.sql:/docker-entrypoint-initdb.d/01-sistema_vet_app.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin
    container_name: sistema-vet-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_USER: vet
      PMA_PASSWORD: vet
    ports:
      - "8081:80"

volumes:
  mysql-data:
