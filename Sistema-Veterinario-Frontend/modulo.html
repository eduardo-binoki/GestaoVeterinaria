<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão Veterinário · Rotina</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="assets/css/styles.css?v=20261109">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <button
        type="button"
        class="menu-toggle"
        id="menu-toggle"
        aria-label="Abrir menu"
        aria-expanded="false"
        aria-controls="app-drawer"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      <a class="topbar-logo" href="dashboard.html" aria-label="Ir para o painel">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 13.5c-2.7 0-5.5 2.1-5.5 4.3 0 1.4 1.1 2.2 2.4 2.2 1 0 1.9-.4 3.1-.4s2.1.4 3.1.4c1.3 0 2.4-.8 2.4-2.2 0-2.2-2.8-4.3-5.5-4.3Z"/>
          <ellipse cx="5.4" cy="11" rx="2.1" ry="2.7" transform="rotate(-18 5.4 11)"/>
          <ellipse cx="18.6" cy="11" rx="2.1" ry="2.7" transform="rotate(18 18.6 11)"/>
          <ellipse cx="9.2" cy="7.2" rx="2.1" ry="2.8" transform="rotate(-8 9.2 7.2)"/>
          <ellipse cx="14.8" cy="7.2" rx="2.1" ry="2.8" transform="rotate(8 14.8 7.2)"/>
        </svg>
        <span>Gestão Veterinário</span>
      </a>
    </div>

    <div class="topbar-search">
      <div class="search-field">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/>
          <path d="m16.5 16.5 4 4"/>
        </svg>
        <input
          type="search"
          id="busca-rotinas"
          class="search-input"
          placeholder="Pesquisar..."
          autocomplete="off"
          aria-label="Pesquisar rotina"
          aria-expanded="false"
          aria-controls="busca-resultados"
          aria-autocomplete="list"
          aria-haspopup="listbox"
          role="combobox"
        >
      </div>
      <div class="search-results" id="busca-resultados" role="listbox" hidden></div>
    </div>

    <div class="topbar-user" id="user-menu">
      <button
        type="button"
        class="user-button"
        id="user-menu-toggle"
        aria-haspopup="menu"
        aria-expanded="false"
        aria-controls="user-dropdown"
      >
        <div class="user-info">
          <strong id="usuario-nome">Carregando...</strong>
          <span id="usuario-email"></span>
        </div>
        <div class="avatar" id="usuario-avatar">--</div>
        <svg class="user-chevron" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m6 9 6 6 6-6"/>
        </svg>
      </button>

      <div class="user-dropdown" id="user-dropdown" role="menu" hidden>
        <div class="user-dropdown-header">
          <strong id="dropdown-nome">Usuário</strong>
          <span id="dropdown-email"></span>
        </div>

        <a class="user-dropdown-item" href="configuracoes.html" role="menuitem">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>
          </svg>
          Configurações
        </a>

        <button type="button" class="user-dropdown-item danger" id="user-logout" role="menuitem">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <path d="m16 17 5-5-5-5"/>
            <path d="M21 12H9"/>
          </svg>
          Encerrar sessão
        </button>
      </div>
    </div>
  </header>

  <div class="drawer-overlay" id="drawer-overlay" hidden></div>

  <aside class="drawer" id="app-drawer" aria-hidden="true" aria-label="Menu principal">
    <div class="drawer-header">
      <a class="drawer-brand" href="dashboard.html" aria-label="Ir para o painel">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 13.5c-2.7 0-5.5 2.1-5.5 4.3 0 1.4 1.1 2.2 2.4 2.2 1 0 1.9-.4 3.1-.4s2.1.4 3.1.4c1.3 0 2.4-.8 2.4-2.2 0-2.2-2.8-4.3-5.5-4.3Z"/>
          <ellipse cx="5.4" cy="11" rx="2.1" ry="2.7" transform="rotate(-18 5.4 11)"/>
          <ellipse cx="18.6" cy="11" rx="2.1" ry="2.7" transform="rotate(18 18.6 11)"/>
          <ellipse cx="9.2" cy="7.2" rx="2.1" ry="2.8" transform="rotate(-8 9.2 7.2)"/>
          <ellipse cx="14.8" cy="7.2" rx="2.1" ry="2.8" transform="rotate(8 14.8 7.2)"/>
        </svg>
        <span>Gestão Veterinário</span>
      </a>
    </div>

    <nav class="drawer-nav" id="drawer-nav"></nav>

    <div class="drawer-footer">
      <button type="button" class="drawer-logout" id="drawer-logout">Sair da conta</button>
    </div>
  </aside>

  <main class="modulo-page">
    <article class="modulo-card">
      <h1 id="modulo-titulo">Carregando...</h1>

      <div id="modulo-conteudo" class="crud-root" aria-live="polite"></div>
    </article>
  </main>

  <script src="assets/js/config.js?v=20261105"></script>
  <script src="assets/js/session.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/menu-data.js"></script>
  <script src="assets/js/search.js"></script>
  <script src="assets/js/menu.js?v=20261109"></script>
  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/user-menu.js"></script>
  <script src="assets/js/modulo.js?v=20261105b"></script>
</body>
</html>
